<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AiAgentAssistant — Two-Factor Authentication</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-card card">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="login-logo mb-2">
          <i class="bi bi-shield-lock fs-1 text-primary"></i>
        </div>
        <h5 class="fw-bold mb-0">Two-Factor Authentication</h5>
        <small class="text-muted">Enter the 6-digit code from your authenticator app</small>
      </div>

      <div id="alert" class="alert alert-danger d-none py-2" role="alert"></div>

      <form id="totpForm" autocomplete="off">
        <div class="mb-4">
          <label class="form-label small fw-semibold">Authenticator Code</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary"><i class="bi bi-key text-muted"></i></span>
            <input type="text" id="code" name="code"
              class="form-control bg-dark text-light border-secondary text-center fs-5 fw-bold letter-spacing-4"
              placeholder="000000" maxlength="6" inputmode="numeric" pattern="[0-9]*"
              required autocomplete="one-time-code" autofocus>
          </div>
          <div class="form-text text-muted small mt-1">Code refreshes every 30 seconds</div>
        </div>
        <button type="submit" class="btn btn-primary w-100" id="verifyBtn">
          <i class="bi bi-shield-check me-1"></i> Verify
        </button>
      </form>

      <div class="text-center mt-3">
        <a href="/" class="text-muted small">
          <i class="bi bi-arrow-left me-1"></i>Back to login
        </a>
      </div>
    </div>
  </div>

  <script>
    // Auto-format input: only digits, max 6
    document.getElementById('code').addEventListener('input', e => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
    });

    document.getElementById('totpForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn   = document.getElementById('verifyBtn');
      const alert = document.getElementById('alert');
      const code  = document.getElementById('code').value.trim();

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Verifying…';
      alert.classList.add('d-none');

      try {
        const res = await fetch('/api/auth/totp/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/dashboard';
        } else if (data.needsSetup) {
          window.location.href = '/totp-setup';
        } else {
          alert.textContent = data.error || 'Verification failed';
          alert.classList.remove('d-none');
          document.getElementById('code').value = '';
          document.getElementById('code').focus();
        }
      } catch {
        alert.textContent = 'Network error';
        alert.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-shield-check me-1"></i> Verify';
      }
    });
  </script>
</body>
</html>
