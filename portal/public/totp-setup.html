<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AiAgentAssistant — Set Up Two-Factor Authentication</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <style>
    .totp-card { max-width: 460px; }
    .qr-box { background: #fff; border-radius: 8px; display: inline-block; padding: 12px; }
    .secret-key { font-family: monospace; letter-spacing: 2px; font-size: 0.85rem; word-break: break-all; }
    .step-badge { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; flex-shrink: 0; }
  </style>
</head>
<body class="login-body">
  <div class="login-card totp-card card">
    <div class="card-body p-4">
      <div class="text-center mb-3">
        <div class="login-logo mb-2">
          <i class="bi bi-shield-plus fs-1 text-warning"></i>
        </div>
        <h5 class="fw-bold mb-0">Set Up Two-Factor Authentication</h5>
        <small class="text-muted">Required for all portal accounts</small>
      </div>

      <div id="alert" class="alert alert-danger d-none py-2" role="alert"></div>
      <div id="loadingBox" class="text-center py-3">
        <span class="spinner-border spinner-border-sm text-primary"></span>
        <span class="ms-2 text-muted small">Generating your key…</span>
      </div>

      <div id="setupContent" class="d-none">
        <!-- Step 1 -->
        <div class="d-flex align-items-start gap-2 mb-3">
          <div class="step-badge bg-primary text-white">1</div>
          <div>
            <div class="small fw-semibold">Install an authenticator app</div>
            <div class="text-muted" style="font-size:0.8rem">Google Authenticator, Authy, or any TOTP-compatible app</div>
          </div>
        </div>

        <!-- Step 2 — QR code -->
        <div class="d-flex align-items-start gap-2 mb-3">
          <div class="step-badge bg-primary text-white">2</div>
          <div class="flex-grow-1">
            <div class="small fw-semibold mb-2">Scan the QR code</div>
            <div class="text-center mb-2">
              <div class="qr-box">
                <img id="qrImg" src="" alt="QR Code" style="width:180px;height:180px">
              </div>
            </div>
            <div class="text-muted text-center" style="font-size:0.75rem">Can't scan? Enter this key manually:</div>
            <div class="bg-dark border border-secondary rounded p-2 text-center mt-1">
              <span id="secretKey" class="secret-key text-info"></span>
            </div>
          </div>
        </div>

        <!-- Step 3 — confirm -->
        <div class="d-flex align-items-start gap-2 mb-4">
          <div class="step-badge bg-primary text-white">3</div>
          <div class="flex-grow-1">
            <div class="small fw-semibold mb-2">Enter the 6-digit code to confirm</div>
            <form id="confirmForm" autocomplete="off">
              <input type="hidden" id="secretInput">
              <div class="input-group mb-2">
                <span class="input-group-text bg-dark border-secondary"><i class="bi bi-key text-muted"></i></span>
                <input type="text" id="code" name="code"
                  class="form-control bg-dark text-light border-secondary text-center fs-5 fw-bold"
                  placeholder="000000" maxlength="6" inputmode="numeric" pattern="[0-9]*"
                  required autocomplete="one-time-code" autofocus>
              </div>
              <button type="submit" class="btn btn-success w-100" id="confirmBtn">
                <i class="bi bi-shield-check me-1"></i> Activate 2FA
              </button>
            </form>
          </div>
        </div>
      </div>

      <div class="text-center mt-1">
        <a href="/" class="text-muted small">
          <i class="bi bi-arrow-left me-1"></i>Back to login
        </a>
      </div>
    </div>
  </div>

  <script>
    (async () => {
      const loading = document.getElementById('loadingBox');
      const content = document.getElementById('setupContent');
      const alertEl = document.getElementById('alert');

      try {
        const res = await fetch('/api/auth/totp/setup');
        if (!res.ok) {
          if (res.status === 401) { window.location.href = '/'; return; }
          throw new Error('Failed to load setup');
        }
        const { qrDataUrl, secret } = await res.json();
        document.getElementById('qrImg').src = qrDataUrl;
        document.getElementById('secretKey').textContent = secret.replace(/(.{4})/g, '$1 ').trim();
        document.getElementById('secretInput').value = secret;
        loading.classList.add('d-none');
        content.classList.remove('d-none');
      } catch (e) {
        loading.classList.add('d-none');
        alertEl.textContent = e.message || 'Failed to generate setup code';
        alertEl.classList.remove('d-none');
      }
    })();

    document.getElementById('code').addEventListener('input', e => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
    });

    document.getElementById('confirmForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn    = document.getElementById('confirmBtn');
      const alertEl = document.getElementById('alert');
      const code   = document.getElementById('code').value.trim();
      const secret = document.getElementById('secretInput').value;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Activating…';
      alertEl.classList.add('d-none');

      try {
        const res = await fetch('/api/auth/totp/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, secret }),
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/dashboard';
        } else {
          alertEl.textContent = data.error || 'Activation failed';
          alertEl.classList.remove('d-none');
          document.getElementById('code').value = '';
          document.getElementById('code').focus();
        }
      } catch {
        alertEl.textContent = 'Network error';
        alertEl.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-shield-check me-1"></i> Activate 2FA';
      }
    });
  </script>
</body>
</html>
