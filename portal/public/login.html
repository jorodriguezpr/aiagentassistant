<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AiAgentAssistant — Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-card card">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="login-logo mb-2">
          <i class="bi bi-robot fs-1"></i>
        </div>
        <h5 class="fw-bold mb-0">AiAgentAssistant</h5>
        <small class="text-muted">Admin Portal</small>
      </div>

      <div id="alert" class="alert alert-danger d-none py-2" role="alert"></div>

      <form id="loginForm" autocomplete="on">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary"><i class="bi bi-person text-muted"></i></span>
            <input type="text" id="username" name="username"
              class="form-control bg-dark text-light border-secondary"
              placeholder="admin" required autocomplete="username">
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label small fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary"><i class="bi bi-lock text-muted"></i></span>
            <input type="password" id="password" name="password"
              class="form-control bg-dark text-light border-secondary"
              required autocomplete="current-password">
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100" id="loginBtn">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn   = document.getElementById('loginBtn');
      const alert = document.getElementById('alert');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Signing in…';
      alert.classList.add('d-none');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (res.ok && data.requiresTotp) {
          window.location.href = data.needsSetup ? '/totp-setup' : '/totp-verify';
        } else if (res.ok) {
          window.location.href = '/dashboard';
        } else {
          alert.textContent = data.error || 'Login failed';
          alert.classList.remove('d-none');
        }
      } catch {
        alert.textContent = 'Network error — is the portal running?';
        alert.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In';
      }
    });
  </script>
</body>
</html>
